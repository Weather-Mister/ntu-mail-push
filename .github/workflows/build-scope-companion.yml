name: Build NTU Scope Companion

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'companion/NTUScope/**'
      - '.github/workflows/build-scope-companion.yml'
  push:
    branches: [main]
    paths:
      - 'companion/NTUScope/**'
      - '.github/workflows/build-scope-companion.yml'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure native x64 Release (MSVC /MT)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $version = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if (!$version) { throw "MSVC C++ build tools not installed on Windows runner" }
          $major = [int]($version.Split('.')[0])
          $generator = switch ($major) {
            18 { 'Visual Studio 18 2026' }
            17 { 'Visual Studio 17 2022' }
            default { throw "Unsupported Visual Studio major version $major" }
          }
          Write-Host "Found Visual Studio $version; using $generator"
          cmake -S companion/NTUScope -B build/ntu-scope -G $generator -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile no-runtime Windows application
        shell: pwsh
        run: cmake --build build/ntu-scope --config Release --parallel
      - name: Validate executable and size
        shell: pwsh
        run: |
          $exe = "build/ntu-scope/Release/NTUScope.exe"
          if (!(Test-Path $exe)) { throw "Native NTUScope.exe was not produced" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Native audio companion self-tests failed" }
          $version = & $exe --version
          if ($version -notmatch "native 2.0") { throw "Wrong executable version" }
          $bytes = (Get-Item $exe).Length
          Write-Host "NTUScope.exe: $bytes bytes ($([math]::Round($bytes / 1MB, 3)) MiB)"
          if ($bytes -ge 5MB) { throw "Native executable exceeded 5 MiB size budget" }
          New-Item -ItemType Directory -Path dist/scope -Force | Out-Null
          Copy-Item $exe dist/scope/NTUScope.exe
      - name: Upload companion exe
        uses: actions/upload-artifact@v4
        with:
          name: ntu-scope-companion-win-x64
          path: dist/scope/NTUScope.exe
          if-no-files-found: error
