name: Deploy NTU Schedules to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "sites/**"
      - ".github/workflows/deploy-schedule-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ntu-schedule-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build isolated Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/begum
          cp -R sites/eren/. _site/
          cp -R sites/begum/. _site/begum/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload schedule sites
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
