name: Schedule site checks

on:
  push:
    branches: [main]
    paths:
      - "sites/eren/**"
      - ".github/workflows/schedule-migration-check.yml"
      - ".github/workflows/deploy-schedule-pages.yml"
  pull_request:
    paths:
      - "sites/eren/**"
      - ".github/workflows/schedule-migration-check.yml"
      - ".github/workflows/deploy-schedule-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check sites/eren/app.js
          node --check sites/eren/sw.js
      - name: Validate manifest
        run: python -m json.tool sites/eren/manifest.webmanifest >/dev/null
      - name: Check PWA assets
        run: |
          test -f sites/eren/index.html
          test -f sites/eren/styles.css
          test -f sites/eren/app.js
          test -f sites/eren/sw.js
          test -f sites/eren/favicon.svg
          test -f sites/eren/manifest.webmanifest
          test -f sites/eren/schedule-icon-180.png
          test -f sites/eren/schedule-icon-512.png
          test -f sites/eren/vendor/ffmpeg/ffmpeg.js
          test -f sites/eren/vendor/ffmpeg/814.ffmpeg.js
      - name: Reject Hatchable runtime dependencies
        run: |
          if grep -R -n -E 'hatchable\.site|__HATCHABLE__' sites/eren; then exit 1; fi
      - name: Check root PWA excludes Begum path
        run: grep -q "ROOT + 'begum/'" sites/eren/sw.js
