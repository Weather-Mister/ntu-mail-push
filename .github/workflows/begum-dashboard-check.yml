name: Begüm schedule browser checks
on:
  push:
    branches: [main]
    paths:
      - "sites/begum/garden-theme.css"
      - "tests/begum-browser/**"
      - ".github/workflows/begum-dashboard-check.yml"
  pull_request:
    paths:
      - "sites/begum/**"
      - "tests/begum-browser/**"
      - "playwright.begum.config.mjs"
      - ".github/workflows/begum-dashboard-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Desktop Up Next regression on direct pushes
        if: github.event_name == 'push'
        run: npx playwright test --config playwright.begum.config.mjs --grep "desktop Up Next does not clip"
      - name: Full Begüm browser suite on PR or manual request
        if: github.event_name != 'push'
        run: npx playwright test --config playwright.begum.config.mjs
