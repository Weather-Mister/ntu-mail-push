<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 40" aria-hidden="true">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2=".3">
      <stop offset="0" stop-color="#f7e6c9"/>
      <stop offset=".2" stop-color="#e8d3b0"/>
      <stop offset=".68" stop-color="#dfcbaa"/>
      <stop offset="1" stop-color="#c9b08b"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc47b" stop-opacity=".21"/>
      <stop offset=".55" stop-color="#f6b66f" stop-opacity=".055"/>
      <stop offset="1" stop-color="#f6b66f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftFacet" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ad9674"/><stop offset="1" stop-color="#e5d0ae"/>
    </linearGradient>
  </defs>
  <!-- Rigid moulded plastic body, with almost straight sides and bevelled corners. -->
  <path d="M7 1.4H23C26.4 1.4 28 3.5 28 6.4V33.6C28 36.5 26.4 38.6 23 38.6H7C3.6 38.6 2 36.5 2 33.6V6.4C2 3.5 3.6 1.4 7 1.4Z"
