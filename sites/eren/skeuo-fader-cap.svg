<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 40" aria-hidden="true">
  <defs>
    <!-- Same warm, slightly weathered ivory plastic as the console keys. -->
    <linearGradient id="plastic" x1="0" y1="0" x2="1" y2=".45">
      <stop offset="0" stop-color="#e2cda9"/>
      <stop offset=".15" stop-color="#f1e4cb"/>
      <stop offset=".54" stop-color="#dfcaa7"/>
      <stop offset=".87" stop-color="#d0b992"/>
      <stop offset="1" stop-color="#ae9877"/>
    </linearGradient>
    <linearGradient id="upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e9cf"/>
      <stop offset=".58" stop-color="#e6d5b6"/>
      <stop offset="1" stop-color="#c7aa81"/>
    </linearGradient>
    <linearGradient id="lower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b08b"/>
      <stop offset=".25" stop-color="#ddc9a7"/>
      <stop offset="1" stop-color="#bba17c"/>
    </linearGradient>
    <!-- An inset cavity: shaded at the upper rim, lit gently below. -->
    <linearGradient id="scoop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99805f"/>
      <stop offset=".17" stop-color="#b49a77"/>
      <stop offset=".49" stop-color="#ceb590"/>
      <stop offset=".74" stop-color="#e2cfab"/>
      <stop offset="1" stop-color="#f0ddbb"/>
    </linearGradient>
    <linearGradient id="edgeShade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#9b8060" stop-opacity=".55"/>
      <stop offset=".18" stop-color="#9b8060" stop-opacity="0"/>
      <stop offset=".81" stop-color="#866946" stop-opacity="0"/>
      <stop offset="1" stop-color="#866946" stop-opacity=".30"/>
    </linearGradient>
    <radialGradient id="sun" cx=".16" cy=".11" r=".86">
      <stop stop-color="#f6ad56" stop-opacity=".22"/>
      <stop offset=".63" stop-color="#f6ad56" stop-opacity=".055"/>
      <stop offset="1" stop-color="#f6ad56" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="faceClip">
      <path d="M7 2.6 H23 L26.1 5.6 V34.5 L23 37.4 H7 L3.9 34.5 V5.6 Z"/>
    </clipPath>
  </defs>
  <!-- Mostly straight, solid shell with subtle moulded corners. -->
  <path d="M7 1.6 H23 Q27.6 1.6 28 6.2 V33.8 Q27.6 38.4 23 38.4 H7 Q2.4 38.4 2 33.8 V6.2 Q2.4 1.6 7 1.6 Z"
        fill="#a8916f" stroke="#837054" stroke-width=".8"/>
  <path d="M7 2.6 H23 L26.1 5.6 V34.5 L23 37.4 H7 L3.9 34.5 V5.6 Z" fill="url(#plastic)"/>
  <g clip-path="url(#faceClip)">
    <!-- Upper and lower shoulders curve down into a depressed centre. -->
    <path d="M4.7 5.4 H25.3 V14.5 Q15 17.3 4.7 14.5 Z" fill="url(#upper)"/>
    <path d="M4.7 25.5 Q15 22.7 25.3 25.5 V35 H4.7 Z" fill="url(#lower)"/>
    <path d="M4.7 14.5 Q15 17.3 25.3 14.5 L25.3 25.5 Q15 22.7 4.7 25.5 Z" fill="url(#scoop)"/>
    <!-- Soft inner shadow directly below upper lip, bright catch on lower lip. -->
    <path d="M4.8 14.65 Q15 17.35 25.2 14.65" stroke="#7b6349" stroke-opacity=".53" stroke-width="1.35" fill="none"/>
    <path d="M4.8 15.6 Q15 18.2 25.2 15.6" stroke="#aa8f6b" stroke-opacity=".26" stroke-width=".7" fill="none"/>
    <path d="M4.8 25.5 Q15 22.7 25.2 25.5" stroke="#fff2d8" stroke-opacity=".78" stroke-width="1.05" fill="none"/>
    <path d="M4.8 26.25 Q15 23.45 25.2 26.25" stroke="#a98d68" stroke-opacity=".21" stroke-width=".55" fill="none"/>
    <!-- Edge facets, subtle warm illumination and a pale top edge. -->
    <path d="M3.9 5.6 L6.2 6.3 V33.7 L3.9 34.5 Z" fill="#fff5db" opacity=".23"/>
    <path d="M26.1 5.6 L23.8 6.3 V33.7 L26.1 34.5 Z" fill="#8a7052" opacity=".16"/>
    <path d="M4 3 H26 V38 H4 Z" fill="url(#edgeShade)"/>
    <path d="M4 3 H26 V38 H4 Z" fill="url(#sun)"/>
    <path d="M7.1 3.5 H22.9" stroke="#fff8e8" stroke-width=".8" stroke-opacity=".75"/>
    <path d="M7.1 36.8 H22.9" stroke="#947958" stroke-width=".6" stroke-opacity=".42"/>
    <!-- Shallow moulded finger-grip ribs, following the curved shoulders. -->
    <g fill="none" stroke-linecap="round">
      <path d="M8 8.4 Q15 9.45 22 8.4 M8 11.2 Q15 12.55 22 11.2
               M8 28.8 Q15 27.45 22 28.8 M8 31.6 Q15 30.55 22 31.6"
            stroke="#917757" stroke-width=".92" stroke-opacity=".55"/>
      <path d="M8 7.75 Q15 8.8 22 7.75 M8 10.55 Q15 11.9 22 10.55
               M8 28.15 Q15 26.8 22 28.15 M8 30.95 Q15 29.9 22 30.95"
            stroke="#fff2d9" stroke-width=".7" stroke-opacity=".8"/>
    </g>
  </g>
</svg>