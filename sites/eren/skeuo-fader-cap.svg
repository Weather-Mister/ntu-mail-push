  <path d="M7 2.4H23L26.4 5.4V34.7L23 37.7H7L3.6 34.7V5.4Z" fill="url(#face)"/>
  <!-- Light-catching upper bevel, solid edge facets and a crisp base. -->
  <path d="M7 2.5H23L25 5.8H5Z" fill="#f8e9cf" opacity=".9"/>
  <path d="M3.6 5.4L6.3 6.3V33.6L3.6 34.7Z" fill="url(#leftFacet)" opacity=".62"/>
  <path d="M26.4 5.4L23.8 6.3V33.6L26.4 34.7Z" fill="#a88e6c" opacity=".45"/>
  <path d="M7 37.7L5 34.2H25L23 37.7Z" fill="#b69c78" opacity=".58"/>
  <path d="M6.3 6.1H23.8V33.8H6.3Z" fill="url(#warm)"/>
  <path d="M5.3 5.8H24.6" stroke="#fff8e7" opacity=".62" stroke-width=".7"/>
  <path d="M5 34.3H25" stroke="#8d7252" opacity=".38" stroke-width=".7"/>
  <!-- Four short shallow recessed ribs; the centre face stays unmarked. -->
  <g fill="none" stroke-linecap="round">
    <path d="M8.2 10.4H21.8 M8.2 13.8H21.8 M8.2 26.2H21.8 M8.2 29.6H21.8"
