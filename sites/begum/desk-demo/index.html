<script>
"use strict";
// This page is an isolated design demo. Never fetch or write production schedule APIs.
const courses={
 women:{name:"Exploring Taiwan: Women and Taiwanese Society",place:"Boya · Room 202",color:"#d997ae"},
 globalhealth:{name:"Essentials of Global Health",place:"NTU Hospital · Room 211",color:"#8aae94"},
 macro:{name:"Macroeconomics (1)",place:"Social Sciences · Room 202",color:"#d9b269"},
 statistics:{name:"Statistics with Recitation",place:"Social Sciences · Room 502",color:"#8aa3c5"},
 period:{name:"Period: Theory, Thoughts and Actions",place:"Boya · Room 102",color:"#b1a0ca"},
 resources:{name:"Exploring Taiwan: Natural Resources",place:"Boya · Room 202",color:"#95b29b"},
 micro:{name:"Microeconomics (1)",place:"Social Sciences · Room 507",color:"#d29d8c"},
 toc:{name:"TOC",place:"Outside class",color:"#9aadb2"}
};
const lessons={1:[{id:"women",start:"10:20",end:"12:10"},{id:"globalhealth",start:"13:20",end:"16:20"}],2:[{id:"macro",start:"10:20",end:"13:10",optional:true}],3:[{id:"statistics",start:"09:10",end:"12:10"},{id:"period",start:"16:30",end:"18:20"}],4:[{id:"resources",start:"13:20",end:"15:10"},{id:"statistics",start:"15:30",end:"17:20"},{id:"toc",start:"18:30",end:"19:20"}],5:[{id:"toc",start:"10:20",end:"12:10"},{id:"micro",start:"13:20",end:"16:20"}],6:[]};
const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const shortDays=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const $=id=>document.getElementById(id);
const taipeiParts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
const clockFormat=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Taipei",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
const monthFormat=new Intl.DateTimeFormat("en-US",{timeZone:"UTC",month:"short"});
const fullDateFormat=new Intl.DateTimeFormat("en-US",{timeZone:"UTC",month:"long",day:"numeric"});
function parts(){return Object.fromEntries(taipeiParts.formatToParts(new Date()).filter(p=>p.type!=="literal").map(p=>[p.type,Number(p.value)]));}
function dayInTaipei(){const p=parts();return new Date(Date.UTC(p.year,p.month-1,p.day));}
function addDays(date,n){const d=new Date(date);d.setUTCDate(d.getUTCDate()+n);return d;}
function monday(date){return addDays(date,-((date.getUTCDay()+6)%7));}
function mins(str){const [h,m]=str.split(":").map(Number);return h*60+m;}
function label(date){return monthFormat.format(date)+" "+date.getUTCDate();}
function svgUse(symbol,className="icon"){const el=document.createElementNS("http://www.w3.org/2000/svg","svg");el.setAttribute("class",className);el.setAttribute("viewBox",symbol==="i-flower"?"0 0 40 40":"0 0 24 24");el.setAttribute("aria-hidden","true");const use=document.createElementNS("http://www.w3.org/2000/svg","use");use.setAttribute("href","#"+symbol);el.append(use);return el;}
let today=dayInTaipei(),weekShift=0,selected=today.getUTCDay();
if(selected===0||selected===6)selected=1; // Show an illustrative class day on weekends.
const taskKey="begum-desk-demo-only-v1:tasks";
const samples=[{id:"sample-task-1",text:"Read the chapter before class",done:false},{id:"sample-task-2",text:"Review this week's notes",done:false},{id:"sample-task-3",text:"Pick up a little treat",done:true}];
function loadTasks(){try{const x=JSON.parse(localStorage.getItem(taskKey));if(Array.isArray(x))return x.filter(t=>t&&typeof t.id==="string"&&typeof t.text==="string"&&typeof t.done==="boolean").slice(0,100);}catch{}return samples.map(t=>({...t}));}
let tasks=loadTasks();
function saveTasks(){try{localStorage.setItem(taskKey,JSON.stringify(tasks));}catch{}}
function renderWeek(){const mondayDate=addDays(monday(today),weekShift*7),sat=addDays(mondayDate,5);$("weekRange").textContent=label(mondayDate)+" – "+label(sat);const rail=$("dayRail");rail.replaceChildren();for(let d=1;d<=6;d++){const dt=addDays(mondayDate,d-1);const btn=document.createElement("button");btn.type="button";btn.className="day-tile"+(d===selected?" active":"")+(dt.getTime()===today.getTime()?" today":"");btn.setAttribute("aria-label",days[d]+", "+fullDateFormat.format(dt));btn.setAttribute("aria-pressed",String(d===selected));if(d===selected)btn.setAttribute("aria-current","date");const left=document.createElement("span");const name=document.createElement("span");name.className="day-name";name.textContent=shortDays[d];const note=document.createElement("span");note.className="day-note";note.textContent=lessons[d].length===0?"Take it slow":lessons[d].length+" bloom"+(lessons[d].length===1?"":"s");left.append(name,note);const number=document.createElement("span");number.className="day-date";number.textContent=dt.getUTCDate();btn.append(left,number,svgUse("i-flower","tile-flower"));btn.addEventListener("click",()=>{selected=d;renderWeek();});rail.append(btn);}renderClasses(mondayDate);}
function renderClasses(mondayDate){const chosen=addDays(mondayDate,selected-1),arr=lessons[selected],isToday=chosen.getTime()===today.getTime(),p=parts(),now=p.hour*60+p.minute;$("dayTitle").textContent=days[selected];$("classCount").textContent=arr.length+" class"+(arr.length===1?"":"es");const list=$("classList");list.replaceChildren();if(!arr.length){const box=document.createElement("div");box.className="empty-garden";const icon=document.createElement("div");icon.className="empty-icon";icon.append(svgUse("i-sprout","empty-icon"));const title=document.createElement("strong");title.textContent="A day to grow at your own pace";const sub=document.createElement("p");sub.textContent="No classes in this little garden today. Enjoy the space.";box.append(icon,title,sub);list.append(box);}for(const lesson of arr){const course=courses[lesson.id];const past=isToday&&now>=mins(lesson.end),live=isToday&&now>=mins(lesson.start)&&now<mins(lesson.end);const row=document.createElement("article");row.className="class-card"+(past?" is-done":"")+(live?" is-live":"");row.style.setProperty("--course-color",course.color);const time=document.createElement("div");time.className="class-time";time.textContent=lesson.start;const end=document.createElement("small");end.textContent="to "+lesson.end;time.append(end);const copy=document.createElement("div");copy.className="class-copy";const h=document.createElement("h3");h.textContent=course.name;const loc=document.createElement("p");loc.className="class-location";loc.append(svgUse("i-pin"),document.createTextNode(course.place));copy.append(h,loc);if(lesson.optional||live){const tags=document.createElement("div");tags.className="class-tags";if(lesson.optional){const t=document.createElement("span");t.className="tag";t.textContent="Optional";tags.append(t);}if(live){const t=document.createElement("span");t.className="tag live";t.textContent="Happening now";tags.append(t);}copy.append(tags);}row.append(time,copy,svgUse("i-flower","course-flower"));list.append(row);}
}
function renderTasks(){const list=$("taskList");list.replaceChildren();for(const item of tasks){const li=document.createElement("li");li.className="task-item"+(item.done?" completed":"");const check=document.createElement("button");check.type="button";check.className="task-check"+(item.done?" checked":"");check.setAttribute("aria-label",(item.done?"Mark incomplete: ":"Mark complete: ")+item.text);check.setAttribute("aria-pressed",String(item.done));if(item.done)check.append(svgUse("i-check"));check.addEventListener("click",()=>{item.done=!item.done;saveTasks();renderTasks();});const txt=document.createElement("span");txt.className="task-text";txt.textContent=item.text;const del=document.createElement("button");del.type="button";del.className="delete-task";del.setAttribute("aria-label","Delete "+item.text);del.append(svgUse("i-trash"));del.addEventListener("click",()=>{tasks=tasks.filter(x=>x.id!==item.id);saveTasks();renderTasks();});li.append(check,txt,del);list.append(li);}if(!tasks.length){const li=document.createElement("li");li.className="task-empty";li.textContent="No tasks yet.";list.append(li);}$("taskCount").textContent=tasks.filter(x=>!x.done).length+" left";}
$("taskForm").addEventListener("submit",e=>{e.preventDefault();const input=$("taskInput"),value=input.value.trim();if(!value)return;tasks.unshift({id:"task-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),text:value,done:false});tasks=tasks.slice(0,100);saveTasks();renderTasks();input.value="";input.focus();});
$("prevWeek").addEventListener("click",()=>{weekShift=Math.max(-26,weekShift-1);renderWeek();});
$("nextWeek").addEventListener("click",()=>{weekShift=Math.min(26,weekShift+1);renderWeek();});
$("todayButton").addEventListener("click",()=>{today=dayInTaipei();weekShift=0;selected=today.getUTCDay()||1;renderWeek();});
function tick(){const next=dayInTaipei();if(today.getTime()!==next.getTime()){today=next;weekShift=0;selected=today.getUTCDay()||1;}renderWeek();}
renderTasks();tick();setInterval(tick,60_000);
</script>
